<svg xmlns="http://www.w3.org/2000/svg" width="720" height="355" viewBox="0 0 720 355" role="img">
<title>常数直通减三角低通谱的高通响应</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#334155"/></marker></defs>
<rect width="720" height="355" fill="white"/>
<text x="360" y="29" text-anchor="middle" font-size="23" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">H(jω)=|ω|/2（|ω|≤2π），带外为π</text>
<path d="M38 259H687" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M359 280V61" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="45.00,106.00 205.00,106.00 359.00,259.00 513.00,106.00 680.00,106.00" fill="none" stroke="#0f766e" stroke-width="3"/>
<path d="M205 106V259" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="4 4"/>
<path d="M513 106V259" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="4 4"/>
<text x="339" y="113" text-anchor="end" font-size="22" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">π</text>
<text x="388" y="68" text-anchor="start" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">H(jω)</text>
<text x="205" y="290" text-anchor="middle" font-size="21" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">−2π</text>
<text x="359" y="290" text-anchor="middle" font-size="21" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">0</text>
<text x="513" y="290" text-anchor="middle" font-size="21" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">2π</text>
<text x="677" y="290" text-anchor="middle" font-size="21" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">ω</text>
<text x="360" y="329" text-anchor="middle" font-size="21" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">h₂ 支路加、h₁ 支路减；直流被滤除</text>
</svg>