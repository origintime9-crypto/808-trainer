<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img">
<title>正负矩形与高度2矩形的卷积</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#334155"/></marker></defs>
<rect width="720" height="360" fill="white"/>
<text x="360" y="29" text-anchor="middle" font-size="23" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">y=f*h：支撑 −2..1，正负峰分别为 ±2</text>
<path d="M43 181H682" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M430 306V57" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="46.00,181.00 214.00,181.00 322.00,81.00 430.00,281.00 538.00,181.00 678.00,181.00" fill="none" stroke="#0f766e" stroke-width="3"/>
<path d="M214 181V187" fill="none" stroke="#334155" stroke-width="1.8"/>
<text x="214" y="210" text-anchor="middle" font-size="19" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">−2</text>
<path d="M322 181V187" fill="none" stroke="#334155" stroke-width="1.8"/>
<text x="322" y="210" text-anchor="middle" font-size="19" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">−1</text>
<path d="M376.0 181V187" fill="none" stroke="#334155" stroke-width="1.8"/>
<text x="376.0" y="210" text-anchor="middle" font-size="19" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">−1/2</text>
<path d="M430 181V187" fill="none" stroke="#334155" stroke-width="1.8"/>
<text x="430" y="210" text-anchor="middle" font-size="19" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">0</text>
<path d="M538 181V187" fill="none" stroke="#334155" stroke-width="1.8"/>
<text x="538" y="210" text-anchor="middle" font-size="19" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">1</text>
<path d="M322 281H430" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="4 4"/>
<text x="445" y="288" text-anchor="start" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">−2</text>
<path d="M322 81H430" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="4 4"/>
<text x="445" y="88" text-anchor="start" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">2</text>
<text x="671" y="210" text-anchor="middle" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">t</text>
<text x="455" y="65" text-anchor="start" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">y(t)</text>
<text x="360" y="334" text-anchor="middle" font-size="21" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">分段斜率 2、−4、2；过零点 −1/2</text>
</svg>