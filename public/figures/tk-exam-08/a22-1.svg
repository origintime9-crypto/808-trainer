<text x="360" y="29" text-anchor="middle" font-size="22" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">f′=u(t+2)−u(t−4)−4δ(t)−2δ(t−4)</text>
<path d="M39 116H682" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M210 320V50" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
