<text x="526" y="205" text-anchor="start" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">权重 −2</text>
<text x="196" y="77" text-anchor="end" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">1</text>
