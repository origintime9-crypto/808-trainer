<path d="M140 345H460" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="4 4"/>
<text x="122" y="99" text-anchor="end" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">2</text>
<path d="M140 93H300" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="4 4"/>
<polyline points="60.00,219.00 140.00,219.00 300.00,93.00 460.00,345.00 620.00,219.00 684.00,219.00" fill="none" stroke="#0f766e" stroke-width="3"/>
