<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img">
<title>p为正时实轴零点−p/4和极点p/3的方向示意</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#334155"/></marker></defs>
<rect width="720" height="300" fill="white"/>
<text x="360" y="30" text-anchor="middle" font-size="22" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">p&gt;0的方向示意：零点−p/4，极点p/3</text>
<path d="M125 150H603" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M344 230V71" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="254" cy="150" r="7" fill="white" stroke="#0f766e" stroke-width="2.8"/>
<path d="M458 144L470 156M458 156L470 144" fill="none" stroke="#0f766e" stroke-width="2.8"/>
<text x="254" y="184" text-anchor="middle" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">−p/4</text>
<text x="344" y="184" text-anchor="middle" font-size="19" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">0</text>
<text x="465" y="184" text-anchor="middle" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">p/3</text>
<text x="622" y="177" text-anchor="middle" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">Re z</text>
<text x="383" y="73" text-anchor="middle" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">Im z</text>
<text x="360" y="260" text-anchor="middle" font-size="19" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">p&lt;0时位置换向；p=0相消为H=1，无实际传输极点</text>
<text x="360" y="286" text-anchor="middle" font-size="17" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">此图未固定p的值，不用示意距离推断稳定边界</text>
</svg>