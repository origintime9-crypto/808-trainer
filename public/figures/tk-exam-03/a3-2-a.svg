<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img">
<title>A 点：cos(100t) 的冲激谱</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#334155"/></marker></defs>
<rect width="720" height="340" fill="white"/>
<text x="360" y="30" text-anchor="middle" font-size="22" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">A 点：cos(100t) 的冲激谱</text>
<path d="M38 253H690" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M360.0 270V53" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="668" y="301" text-anchor="middle" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">ω (rad/s)</text>
<path d="M130.76923076923077 253V259" fill="none" stroke="#334155" stroke-width="1.8"/>
<text x="130.76923076923077" y="282" text-anchor="middle" font-size="17" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">−100</text>
<path d="M360.0 253V259" fill="none" stroke="#334155" stroke-width="1.8"/>
<text x="360.0" y="282" text-anchor="middle" font-size="17" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">0</text>
<path d="M589.2307692307692 253V259" fill="none" stroke="#334155" stroke-width="1.8"/>
<text x="589.2307692307692" y="282" text-anchor="middle" font-size="17" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">100</text>
<path d="M130.76923076923077 253V95" fill="none" stroke="#0f766e" stroke-width="2.8" marker-end="url(#arrow)"/>
<text x="130.76923076923077" y="80" text-anchor="middle" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">π</text>
<path d="M589.2307692307692 253V95" fill="none" stroke="#0f766e" stroke-width="2.8" marker-end="url(#arrow)"/>
<text x="589.2307692307692" y="80" text-anchor="middle" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">π</text>
<text x="26" y="240" text-anchor="middle" font-size="22" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">…</text>
<text x="699" y="240" text-anchor="middle" font-size="22" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">…</text>
<text x="360" y="321" text-anchor="middle" font-size="17" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">谱线在 ±100 rad/s，每根冲激强度 π</text>
</svg>