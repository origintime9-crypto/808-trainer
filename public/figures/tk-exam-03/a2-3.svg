<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img">
<title>仅在 a=1、b=2 时的卷积图</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#334155"/></marker></defs>
<rect width="720" height="380" fill="white"/>
<text x="360" y="32" text-anchor="middle" font-size="22" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">条件例子：a=1、b=2</text>
<path d="M35 275H690" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M275 301V57" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="175" y="302" text-anchor="middle" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">-1</text>
<text x="275" y="302" text-anchor="middle" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">0</text>
<text x="375" y="302" text-anchor="middle" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">1</text>
<text x="475" y="302" text-anchor="middle" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">2</text>
<text x="575" y="302" text-anchor="middle" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">3</text>
<text x="257" y="221" text-anchor="end" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">1</text>
<path d="M275 215H375" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="4 4"/>
<text x="257" y="161" text-anchor="end" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">2</text>
<path d="M275 155H375" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="4 4"/>
<text x="257" y="101" text-anchor="end" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">3</text>
<path d="M275 95H375" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="4 4"/>
<polyline points="175.00,275.00 275.00,155.00 375.00,95.00 475.00,215.00 575.00,275.00" fill="none" stroke="#0f766e" stroke-width="3"/>
<text x="676" y="299" text-anchor="middle" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">t</text>
<text x="360" y="341" text-anchor="middle" font-size="17" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">仅用于已确认转折时刻的情形，原题图未给 a、b</text>
<text x="360" y="368" text-anchor="middle" font-size="17" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">支撑 −1..3，峰值 3，面积 6</text>
</svg>