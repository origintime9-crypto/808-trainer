<rect width="720" height="398" fill="white"/>
<text x="360" y="31" text-anchor="middle" font-size="23" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">采用横轴−4/+4的条件波形</text>
<path d="M55 274H688" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M360 292V72" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="80.00,274.00 136.00,274.00 136.00,111.00 360.00,274.00 584.00,111.00 584.00,274.00 640.00,274.00" fill="none" stroke="#0f766e" stroke-width="3"/>
