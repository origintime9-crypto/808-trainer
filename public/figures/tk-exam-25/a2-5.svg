<text x="360" y="346" text-anchor="middle" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">原图左印4、右印−4，条件解释已写明</text>
<text x="360" y="381" text-anchor="middle" font-size="22" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">Y(jω)=2R(2ω)，Y(0)=4</text>
