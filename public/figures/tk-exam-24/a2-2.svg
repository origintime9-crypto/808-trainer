<svg xmlns="http://www.w3.org/2000/svg" width="720" height="474" viewBox="0 0 720 474" role="img">
<title>课程24二2：总系统恒等直通与第二子系统FIR分别实现</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#334155"/></marker></defs>
<rect width="720" height="474" fill="white"/>
<text x="360" y="31" text-anchor="middle" font-size="23" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">“该系统”两种指代分别画图</text>
<text x="360" y="70" text-anchor="middle" font-size="21" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">整体H=1：0延迟器、0非单位增益乘法器</text>
<path d="M105 110H618" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="79" y="117" text-anchor="middle" font-size="21" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">x[k]</text>
<text x="665" y="117" text-anchor="middle" font-size="21" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">y[k]</text>
<text x="360" y="173" text-anchor="middle" font-size="21" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">第二子系统H₂：2单位延迟器、1乘法器</text>
<path d="M67 237H601" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="620" cy="237" r="17" fill="white" stroke="#334155" stroke-width="1.8"/>
<text x="620" y="245" text-anchor="middle" font-size="24" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">+</text>
<path d="M638 237H689" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="85" y="216" text-anchor="middle" font-size="21" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">x₂[k]</text>
<text x="678" y="216" text-anchor="middle" font-size="21" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">y₂[k]</text>
<circle cx="130" cy="237" r="3" fill="#0f766e"/>
<path d="M130 237V337H192" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="198" y="315" width="72" height="44" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/>
<text x="234.0" y="344" text-anchor="middle" font-size="22" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">z⁻¹</text>
<path d="M270 337H324" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="330" y="315" width="72" height="44" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/>
<text x="366.0" y="344" text-anchor="middle" font-size="22" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">z⁻¹</text>
<path d="M402 337H464" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="470" y="315" width="96" height="44" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/>
<text x="518.0" y="344" text-anchor="middle" font-size="22" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">−1/4</text>
<path d="M566 337H620V256" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="404" text-anchor="middle" font-size="23" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">y₂[k]=x₂[k]−x₂[k−2]/4</text>
<text x="360" y="443" text-anchor="middle" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">以上H₂采用原奇数样值补零的条件</text>
<text x="360" y="468" text-anchor="middle" font-size="19" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">最少元件数量不把单位直通计为乘法器</text>
</svg>