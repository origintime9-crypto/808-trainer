<svg xmlns="http://www.w3.org/2000/svg" width="720" height="530" viewBox="0 0 720 530" role="img">
<title>课程20二5：外半谱调制得到中心为零的V形输出谱</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#334155"/></marker></defs>
<rect width="720" height="530" fill="white"/>
<text x="360" y="28" text-anchor="middle" font-size="22" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">H₁只留外半谱，再乘cos(ωc+ω₁)t</text>
<path d="M50 218H687" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M360 242V61" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="382" y="78" text-anchor="middle" font-size="21" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">R₂</text>
