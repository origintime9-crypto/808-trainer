<text x="530" y="463" text-anchor="middle" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">ω₁</text>
<text x="348" y="458" text-anchor="middle" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">0</text>
<text x="687" y="460" text-anchor="middle" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">ω</text>
<text x="312" y="335" text-anchor="middle" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">A/4</text>
<path d="M190 333H530" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 4"/>
<text x="360" y="511" text-anchor="middle" font-size="19" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">|ω|&lt;ω₁内Y=A|ω|/(4ω₁)；严格通带边界取0</text>
