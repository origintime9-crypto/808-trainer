<text x="240" y="250" text-anchor="middle" font-size="17" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">−ωc</text>
<text x="480" y="250" text-anchor="middle" font-size="17" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">ωc</text>
<text x="560" y="250" text-anchor="middle" font-size="17" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">ωc+ω₁</text>
<text x="252" y="112" text-anchor="middle" font-size="19" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">A/2</text>
<text x="507" y="112" text-anchor="middle" font-size="19" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">A/2</text>
<text x="350" y="240" text-anchor="middle" font-size="17" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">0</text>
<text x="687" y="245" text-anchor="middle" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">ω</text>
<text x="360" y="290" text-anchor="middle" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">Y(jω)：每次余弦各乘1/2，最终两边内侧A/4</text>
<path d="M50 433H687" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
