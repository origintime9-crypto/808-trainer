<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img">
<title>课程20二1：中图作为y1(t)时的条件积分波形</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#334155"/></marker></defs>
<rect width="720" height="350" fill="white"/>
<text x="360" y="29" text-anchor="middle" font-size="21" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">条件：原F(ω)标签的中图解释为y₁(t)</text>
<text x="360" y="56" text-anchor="middle" font-size="19" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">y₂从t=−1起升，t=1达2，t=2回到平台1</text>
<path d="M50 250H690" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M300 275V66" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="53.00,250.00 214.00,250.00 386.00,90.00 472.00,170.00 678.00,170.00" fill="none" stroke="#0f766e" stroke-width="3"/>
<text x="214" y="277" text-anchor="middle" font-size="19" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">−1</text>
<text x="290" y="277" text-anchor="middle" font-size="19" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">0</text>
<text x="386" y="277" text-anchor="middle" font-size="19" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">1</text>
<text x="472" y="277" text-anchor="middle" font-size="19" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">2</text>
<text x="282" y="176" text-anchor="end" font-size="19" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">1</text>
<text x="282" y="96" text-anchor="end" font-size="19" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">2</text>
<text x="687" y="275" text-anchor="middle" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">t</text>
<text x="335" y="80" text-anchor="middle" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">y₂(t)</text>
<path d="M386 90V250" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
<path d="M472 170V250" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="360" y="322" text-anchor="middle" font-size="19" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">正面积2，负面积−1；从负无穷积分后最终为1</text>
</svg>