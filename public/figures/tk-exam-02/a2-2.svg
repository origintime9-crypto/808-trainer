<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img">
<title>f(4−2t)=g(1−t) 的波形</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#334155"/></marker></defs>
<rect width="720" height="380" fill="white"/>
<text x="360" y="32" text-anchor="middle" font-size="22" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">f(4−2t)=g(1−t)</text>
<path d="M35 190H690" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M299 302V57" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="187" y="215" text-anchor="middle" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">-1</text>
<text x="299" y="215" text-anchor="middle" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">0</text>
<text x="411" y="215" text-anchor="middle" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">1</text>
<text x="523" y="215" text-anchor="middle" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">2</text>
<text x="635" y="215" text-anchor="middle" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">3</text>
<text x="276" y="111" text-anchor="middle" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">1</text>
<text x="272" y="281" text-anchor="middle" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">−1</text>
<polyline points="187.00,190.00 187.00,275.00 299.00,275.00 299.00,105.00 411.00,105.00 635.00,275.00 635.00,190.00" fill="none" stroke="#0f766e" stroke-width="3"/>
<text x="672" y="215" text-anchor="middle" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">t</text>
<text x="360" y="343" text-anchor="middle" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">(−1,0) 为 −1；(0,1) 为 1；(1,3) 为 2−t</text>
<text x="360" y="368" text-anchor="middle" font-size="17" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">其余为 0，跳变端点按阶跃约定</text>
</svg>