<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" role="img">
<title>双线性微分器的单延时实现</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#334155"/></marker></defs>
<rect width="720" height="410" fill="white"/>
<text x="360" y="30" text-anchor="middle" font-size="23" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">H_d(z)=(2/Tₛ)(1−z⁻¹)/(1+z⁻¹)</text>
<circle cx="150" cy="145" r="20" fill="white" stroke="#334155" stroke-width="1.8"/>
<text x="150" y="152" text-anchor="middle" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">Σ</text>
<circle cx="420" cy="145" r="20" fill="white" stroke="#334155" stroke-width="1.8"/>
<text x="420" y="152" text-anchor="middle" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">Σ</text>
<text x="36" y="126" text-anchor="middle" font-size="21" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">f(k)</text>
<path d="M57 145H130" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="130" y="131" text-anchor="middle" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">+</text>
<path d="M170 145H400" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="285" y="126" text-anchor="middle" font-size="21" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">w(k)</text>
<circle cx="285" cy="145" r="3.5" fill="#334155"/>
<path d="M440 145H502" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="462" y="125" text-anchor="middle" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">w−x</text>
<rect x="502" y="123" width="80" height="44" fill="white" stroke="#334155" stroke-width="1.8"/>
<text x="542.0" y="152" text-anchor="middle" font-size="22" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">2/Tₛ</text>
<path d="M582 145H690" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="661" y="126" text-anchor="middle" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">y(k)</text>
<path d="M285 145V250" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="255" y="250" width="60" height="44" fill="white" stroke="#334155" stroke-width="1.8"/>
<text x="285.0" y="279" text-anchor="middle" font-size="22" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">z⁻¹</text>
<path d="M285 294V320" fill="none" stroke="#334155" stroke-width="1.8"/>
<circle cx="285" cy="320" r="3.5" fill="#334155"/>
<text x="321" y="307" text-anchor="middle" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">x(k)</text>
<path d="M285 320H150V165" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="170" y="180" text-anchor="middle" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">−</text>
<path d="M285 320H420V165" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="438" y="180" text-anchor="middle" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">−</text>
<text x="400" y="132" text-anchor="middle" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">+</text>
<text x="360" y="371" text-anchor="middle" font-size="21" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">x(k+1)=f(k)−x(k)；y(k)=(2/Tₛ)[f(k)−2x(k)]</text>
<text x="360" y="400" text-anchor="middle" font-size="19" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">极点 −1 位于单位圆上，因果实现不稳定</text>
</svg>