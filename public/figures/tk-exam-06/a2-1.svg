<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img">
<title>正负矩形与宽2单位矩形的卷积</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#334155"/></marker></defs>
<rect width="720" height="390" fill="white"/>
<text x="360" y="30" text-anchor="middle" font-size="23" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">原图卷积：t=0 正峰值，t=2 负峰值</text>
<path d="M47 198H690" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M270 330V63" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M152 198V205" fill="none" stroke="#334155" stroke-width="1.8"/>
<text x="152" y="229" text-anchor="middle" font-size="19" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">−1</text>
<path d="M270 198V205" fill="none" stroke="#334155" stroke-width="1.8"/>
<text x="270" y="229" text-anchor="middle" font-size="19" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">0</text>
<path d="M388 198V205" fill="none" stroke="#334155" stroke-width="1.8"/>
<text x="388" y="229" text-anchor="middle" font-size="19" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">1</text>
<path d="M506 198V205" fill="none" stroke="#334155" stroke-width="1.8"/>
<text x="506" y="229" text-anchor="middle" font-size="19" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">2</text>
<path d="M624 198V205" fill="none" stroke="#334155" stroke-width="1.8"/>
<text x="624" y="229" text-anchor="middle" font-size="19" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">3</text>
<text x="253" y="308" text-anchor="end" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">−1</text>
<text x="253" y="102" text-anchor="end" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">1</text>
<polyline points="75.30,198.00 152.00,198.00 270.00,95.00 506.00,301.00 624.00,198.00 677.10,198.00" fill="none" stroke="#0f766e" stroke-width="3"/>
<path d="M506 198V301" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="4 4"/>
<text x="680" y="228" text-anchor="middle" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">t</text>
<text x="360" y="362" text-anchor="middle" font-size="21" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">原点重叠正矩形；t=2 只重叠负矩形</text>
<text x="360" y="385" text-anchor="middle" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">支撑 −1..3，过零点 t=1，正负面积相消</text>
</svg>