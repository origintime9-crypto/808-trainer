<text x="340" y="354" text-anchor="middle" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">蓝：原谱；绿/橙：平移−2ω₁/+2ω₁的副本。</text>
<text x="340" y="386" text-anchor="middle" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">矩形仅示意支撑；普通双侧谱在临界处只碰边界。</text>
<text x="340" y="419" text-anchor="middle" font-size="18" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">ω₂=2ω₁，ωₛ=ω₂；其他副本按2ω₁继续平移。</text>
