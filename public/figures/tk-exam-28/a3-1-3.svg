<circle cx="554" cy="122" r="18" fill="white" stroke="#334155" stroke-width="1.7"/>
<text x="554" y="129" text-anchor="middle" font-size="21" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">Σ</text>
