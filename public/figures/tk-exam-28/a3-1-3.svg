<text x="242" y="100" text-anchor="middle" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">v[n]</text>
<path d="M397 122H535" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="464" y="100" text-anchor="middle" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">w[n]</text>
