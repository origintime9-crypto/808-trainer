<text x="272" y="330" text-anchor="middle" font-size="19" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">存v[n−1]</text>
<text x="645" y="330" text-anchor="middle" font-size="19" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">存y[n−1]</text>
<text x="360" y="377" text-anchor="middle" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">v=x+(1/2)v[-1]；w=v−2v[-1]</text>
<text x="360" y="412" text-anchor="middle" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">y=w−(1/2)y[-1]；增益符号只算一次</text>
<text x="360" y="451" text-anchor="middle" font-size="19" font-family="Arial,Microsoft YaHei,sans-serif" fill="#334155">零初态回算H=(1−2q)/[(1−q/2)(1+q/2)]</text>
