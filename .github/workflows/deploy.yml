name: 发布 808 刷题网页到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 获取源码
        uses: actions/checkout@v6
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 设置 Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 安装锁定依赖
        run: npm ci
      - name: 检查功能和题库
        run: npm test -- --maxWorkers=1
      - name: 安装数学复核依赖
        run: python -m pip install sympy==1.14.0
      - name: 独立复核解答
        run: npm run verify:math
      - name: 构建网页
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - name: 上传网页
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布网页
        id: deployment
        uses: actions/deploy-pages@v4
